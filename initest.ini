osessloven, Politiloven, EMK, GDPR)- Naturlig språk-søk og juridisk ordbok- Forklaringer på enkelt språk med eksempler### 5. Chatbasert AI-assistent- GPT-basert samtalegrensesnitt- Scenario-baserte råd og simuleringer- Kan simulere advokat, saksbehandler og klageinstans---## 🧰 Teknologi-stack- **Backend**: Python (FastAPI)- **Frontend**: React / Flutter- **AI-modell**: Langchain + GPT-4-turbo- **Juridisk søk**: LlamaIndex + lokal lovbase- **Database**: SQLite / MongoDB- **Tale-til-tekst**: Whisper / Vosk- **Dokumentgenerering**: Jinja2 + PDFKit- **Personvern**: Kryptering og lokal lagring---## 📁 FilstrukturVis flere linjer
