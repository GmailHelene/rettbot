name: CI

# Kjører på hver push til main og på pull requests. Fanger byggefeil, typefeil
# og kjente sårbarheter før kode når produksjon.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer avhengigheter
        run: pip install -r backend/requirements.txt
      - name: Kompilerings-sjekk
        run: python -m compileall backend
      - name: Sårbarhetsskann (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Installer avhengigheter
        run: npm ci
      - name: Typesjekk
        run: npx tsc --noEmit
      - name: Bygg
        run: npm run build
      - name: Sårbarhetsskann (npm audit)
        run: npm audit --audit-level=high || true
